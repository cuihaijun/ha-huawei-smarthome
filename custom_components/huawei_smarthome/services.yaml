speaker_action:
  name: Xiaoyi voice
  description: Use Xiaoyi to speak text or process a natural-language request on a supported Huawei SmartHome speaker.
  fields:
    device_id:
      name: Target device
      description: Huawei SmartHome speaker device that should execute the command.
      required: true
      selector:
        device:
          filter:
            integration: huawei_smarthome
          multiple: true
    action:
      name: Function
      description: Choose text-to-speech or Xiaoyi voice assistant.
      required: true
      selector:
        select:
          translation_key: speaker_action
          options:
            - tts
            - voice_command
    text:
      name: Text
      description: Text to speak or natural-language command to execute.
      required: true
      selector:
        text: {}
    silent:
      name: Silent
      description: Suppress the voice response for natural-language commands; ignored for text-to-speech.
      default: true
      selector:
        boolean:
